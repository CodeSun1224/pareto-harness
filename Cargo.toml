[workspace]
members = ["crates/pareto-protocol", "crates/pareto-kernel"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
schemars = "=1.2.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
jsonschema = { version = "=0.50.0", default-features = false }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "sync"] }
tempfile = "=3.20.0"
